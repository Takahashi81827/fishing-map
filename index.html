<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>釣りスポットマップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    h1 {
      margin: 0;
      padding: 12px;
      text-align: center;
      background: white;
    }

    #map {
      height: calc(100vh - 56px);
      width: 100%;
    }
  </style>
</head>

<body>

<h1>🎣 釣りスポットマップ</h1>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const SUPABASE_URL = "https://nxdlfpelnyxuflrabqhd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Z6xyj-DmmdaibLzPWKlXEA_m1br5tn2";

  const map = L.map("map").setView([35.5, 137.0], 6);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);

  async function loadFishingSpots() {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/fishing_spots?select=*",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const spots = await response.json();

    spots.forEach(spot => {
      const marker = L.marker([
        spot.latitude,
        spot.longitude
      ]).addTo(map);

      marker.bindPopup(`
        <strong>${spot.name}</strong><br>
        🐟 ${spot.fish || "情報なし"}<br>
        📅 ${spot.season || "情報なし"}<br>
        🅿️ 駐車場：${spot.parking ? "あり" : "なし"}<br>
        🚻 トイレ：${spot.toilet ? "あり" : "なし"}<br>
        ${spot.description || ""}
      `);
    });
  }

  loadFishingSpots();
</script>

</body>
</html>
