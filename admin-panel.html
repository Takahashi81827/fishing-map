<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>薬物ダメ絶対マップ 管理画面</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{
  margin:0;
  font-family:sans-serif;
}

h1{
  margin:0;
  padding:12px;
  text-align:center;
  background:#f5f5f5;
}

#form{
  padding:15px;
}

input, textarea, button{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  margin-bottom:10px;
  font-size:16px;
}

button{
  cursor:pointer;
}

#map{
  height:400px;
  width:100%;
}

#message{
  padding:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>薬物ダメ絶対マップ 管理画面</h1>

<div id="form">

  <input id="building_name" placeholder="建物名">

  <input id="person_name" placeholder="名前">

  <input id="address" placeholder="住所">

  <button onclick="searchAddress()">住所検索</button>

  <input id="phone" placeholder="電話番号">

  <input id="various_id" placeholder="各種ID">

  <textarea id="explanation" placeholder="説明"></textarea>

  <div id="message"></div>

</div>

<div id="map"></div>

<div id="form">
  <button onclick="addSpot()">この場所で登録</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const SUPABASE_URL = "https://nxdlfpelnyxuflrabqhd.supabase.co";
const SUPABASE_KEY = "sb_publishable_Z6xyj-DmmdaibLzPWKlXEA_m1br5tn2";

const token = localStorage.getItem("access_token");
const userId = localStorage.getItem("user_id");

if(!token){
  window.location.href="admin.html";
}

const map = L.map("map").setView([35.5,137.0],6);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"&copy; OpenStreetMap contributors"
  }
).addTo(map);

let marker = null;


/* 管理者確認 */

async function checkAdmin(){

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/admin_users?user_id=eq." +
    userId +
    "&select=user_id",
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+token
      }
    }
  );

  const data = await response.json();

  if(!response.ok || data.length===0){

    document.body.innerHTML =
      "<h2 style='padding:20px'>管理者権限がありません。</h2>";

    return false;
  }

  return true;
}


/* 住所検索 */

async function searchAddress(){

  const address =
    document.getElementById("address").value.trim();

  if(!address){
    document.getElementById("message").textContent =
      "住所を入力してください";
    return;
  }

  document.getElementById("message").textContent =
    "住所を検索しています…";

  try{

    const url =
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q=" +
      encodeURIComponent(address);

    const response = await fetch(url,{
      headers:{
        "Accept":"application/json"
      }
    });

    const data = await response.json();

    if(data.length === 0){

      document.getElementById("message").textContent =
        "住所が見つかりませんでした";

      return;
    }

    const lat = parseFloat(data[0].lat);
    const lon = parseFloat(data[0].lon);

    map.setView([lat,lon],16);

    if(marker){
      map.removeLayer(marker);
    }

    marker = L.marker([lat,lon],{
      draggable:true
    }).addTo(map);

    marker.bindPopup("このピンの場所で登録します").openPopup();

    document.getElementById("message").textContent =
      "場所を取得しました。必要ならピンを動かして調整できます。";

  }catch(error){

    document.getElementById("message").textContent =
      "住所検索に失敗しました";
  }
}


/* 地図をタップしてピンを置く */

map.on("click",function(e){

  if(marker){
    map.removeLayer(marker);
  }

  marker = L.marker(e.latlng,{
    draggable:true
  }).addTo(map);

  marker.bindPopup("この場所で登録します").openPopup();

});


/* 登録 */

async function addSpot(){

  if(!marker){

    document.getElementById("message").textContent =
      "先に住所検索するか、地図をタップしてピンを置いてください";

    return;
  }

  const position = marker.getLatLng();

  const buildingName =
    document.getElementById("building_name").value;

  const personName =
    document.getElementById("person_name").value;

  const address =
    document.getElementById("address").value;

  const phone =
    document.
getElementById("phone").value;

  const variousId =
    document.getElementById("various_id").value;

  const explanation =
    document.getElementById("explanation").value;


  const response = await fetch(
    SUPABASE_URL + "/rest/v1/fishing_spots",
    {
      method:"POST",

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },

      body:JSON.stringify({

        name:buildingName,

        latitude:position.lat,
        longitude:position.lng,

        building_name:buildingName,
        person_name:personName,
        address:address,
        phone:phone,
        various_id:variousId,
        explanation:explanation

      })
    }
  );


  if(response.ok){

    document.getElementById("message").textContent =
      "登録しました！";

    document.getElementById("building_name").value="";
    document.getElementById("person_name").value="";
    document.getElementById("address").value="";
    document.getElementById("phone").value="";
    document.getElementById("various_id").value="";
    document.getElementById("explanation").value="";

  }else{

    const error = await response.text();

    document.getElementById("message").textContent =
      "登録に失敗しました";

    console.log(error);
  }

}


checkAdmin();

</script>

</body>
</html>
